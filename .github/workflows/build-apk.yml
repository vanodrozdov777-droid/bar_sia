
name: Build BAR DESK APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'bar-desk/**'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and copy BAR DESK interface
        run: |
          mkdir -p app/src/main/assets

          if [ -f index.html ]; then
            cp index.html app/src/main/assets/index.html
          elif [ -f bar-desk/index.html ]; then
            cp bar-desk/index.html app/src/main/assets/index.html
          else
            echo "ERROR: index.html not found"
            find . -maxdepth 3 -name index.html
            exit 1
          fi

      - name: Check Android project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          echo "Android project files found"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BAR-DESK-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
